<html lang="en">
<head>
<meta charset="UTF-8">
<title>BBU | Home Page</title>
<link rel="icon" type="image/x-icon" href="bbu_icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* Reset */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body{
  background:#f0f4ff;
  color:#222;
}

/* ===== Header & Navbar ===== */
header {
  background: linear-gradient(50deg, #0a4cff, #0033cc);
  color: white;
  padding: 20px 20px;
  display: flex;
  flex-wrap: wrap; 
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.header-left img {
  width: auto;
  height: 90px;
  border-radius: 10%;
  background: white;
  padding: 5px;
}

.header-left h1 {
  font-size: 25px;
  font-family: 'Arial Black';
  line-height: 1.2;
}

nav {
  display: flex;
  align-items: center;
  gap: 20px;
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 20px;
  align-items: center;
}

.nav-links li {
  position: relative;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  display: inline-block;
  transition: 0.3s;
}

.nav-links a:hover {
  color: #ffcc00;
  transform: translateY(-5px); 
}

/* Dropdown Menu CSS */
.dropdown-content {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background-color: white;
  min-width: 150px;
  box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
  border-radius: 4px;
  overflow: hidden;
  z-index: 1;
}

.dropdown-content a {
  color: #333;
  padding: 12px 16px;
  display: block;
  font-size: 14px;
}

.dropdown-content a:hover {
  background-color: #f1f1f1;
  color: #0a4cff;
}

.dropdown:hover .dropdown-content {
  display: block;
}

/* Search Bar */
.search-container {
  display: flex;
  align-items: center;
  background: white;
  border-radius: 20px;
  padding: 5px 15px;
  margin-left: 10px;
}

.search-container input {
  border: none;
  outline: none;
  padding: 5px;
  font-size: 14px;
}

.search-container button {
  background: none;
  border: none;
  cursor: pointer;
  color: #0a4cff;
  font-weight: bold;
}

/* ===== Hero Section ===== */
.hero{
  min-height:60vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background-image:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("https://bbu-webiste-space.sgp1.cdn.digitaloceanspaces.com/campus/bmc/logo/20250315063828_92cfb66428282d4a5575da3efa57cd3e69b140e478e53d3ef20b768851c0412c.jpg");
  background-size:cover;
  background-position:center; 
}

/* ===== Card ===== */
.card{
  background:rgba(255,255,255,0.95);
  padding:20px;
  border-radius:18px;
  width:100%;
  max-width:500px;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
  animation:fadeUp 1s ease;
}

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(30px); }
  to{ opacity:1; transform:translateY(0); }
}

.profile-pic-container {
  display: flex;
  justify-content: center;
  margin: 15px;
}

.profile-pic {
  width: 120px;          
  height: 140px;
  border-radius: 50%;   
  object-fit: cover;     
  border: 4px solid #0a4cff; 
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  padding: 3px;
}

.card h2{ color:#0000ff; margin-bottom:8px; font-size:28px; text-align:center; }
.card h3{ color:#555; margin-bottom:15px; font-weight:normal; text-align:center; }

.info p{
  font-size:16px;
  margin:10px 0;
  padding:10px 10px;
  background:#CAF0F8;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
}

.info span{ font-weight:600; color:#0a4cff; }

footer{
  background:#0a4cff;
  color:white;
  text-align:center;
  padding:15px;
  font-size:14px;
}

/* ===== Responsive ===== */
@media (max-width: 850px) {
  header { flex-direction: column; gap: 15px; }
  .nav-links { gap: 10px; font-size: 14px; }
}

@media (max-width:500px){
  .card{ padding:30px 20px; }
  .header-left h1{ font-size:16px; }
}
</style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="bbu_logo.jpg" alt="Logo">
    <h1>Build Bright University<br>
      <span style="font-family:'Khmer Muol'; font-size: 20px; padding-top: 10px; display: block;">សាកលវិទ្យាល័យបៀលប្រាយ</span>
    </h1>
  </div>

  <nav>
    <ul class="nav-links">
      <li><a href="#" style="color: #ffcc00;">Home</a></li>
      <li><a href="About Us.html">About Us</a></li>
      <li><a href="Contact Us.html">Contact Us</a></li>
      <li class="dropdown">
        <a href="#">More ▾</a>
        <div class="dropdown-content">
          <a href="#">Courses</a>
          <a href="#">E-Learning</a>
          <a href="#">Library</a>
        </div>
      </li>
    </ul>

    <div class="search-container">
      <input type="text" placeholder="Search...">
      <button style="background:none; border:none; cursor:pointer;">🔍</button>
    </div>
  </nav>
</header>

<section class="hero">
  <div class="card">
    <h2>Welcome to BBU</h2>
    <h3>Student Information</h3>
    <div class="profile-pic-container">
      <img src="Chhay.jpg" alt="Student Photo" class="profile-pic">
    </div>
    <div class="info">
      <p><strong>Name:</strong> <span>Chhay</span></p>
      <p><strong>Room:</strong> <span>404</span></p>
      <p><strong>Tel:</strong> <span>096 439 5113</span></p>
      <p><strong>Year:</strong> <span>2</span></p>
      <p><strong>Semester:</strong> <span>2</span></p>
    </div>
  </div>
</section>

<footer>
  © 2026 BBU | Build Bright University - Home Page @Chhay
</footer>

</body>

</html>
